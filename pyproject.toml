[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldsense"
version = "0.1.0"
description = "Environmental sensing with physics-informed AI and wireless communication networks"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    # Core scientific
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "scikit-learn==1.5.2",
    "xarray",
    "requests",
    # Dynamics & symbolic regression
    "pysindy",
    "pysr",
    "sympy",
    # Utilities
    "tqdm",
]

[project.optional-dependencies]
notebooks = ["jupyter", "ipykernel"]
# core.opensense: reading, retrieving and scoring OpenSense CML data
opensense = [
    "netCDF4",
    "pyproj",
    "poligrain>=0.3.1",
    "pycomlink>=0.6",      # wet-antenna models, nearby-link wet/dry
    "mergeplg==0.1.0",     # 0.0.2 on PyPI is a stub; pin the real API
    "pypwsqc>=0.2.1",      # PWS quality control (core.opensense.pws_qc)
    "opencv-python-headless",  # pySTEPS Lucas-Kanade; torch is needed for wet_dry.cnn
]
# mergeplg main (new API, RADOLAN, c0_within) - installed *instead of* 0.1.0 it
# changes merging results, which are then written with a "_mergeplg-main" suffix.
# Not in the default environment; see projects/opensense_pipeline/README.md.
mergeplg-main = ["mergeplg @ git+https://github.com/OpenSenseAction/mergeplg.git@dd380b1ed9b5b6bd38fdb3dfdfcca1659ceb8128"]
dev = ["pytest"]

# Only core/ is a package. Projects are scripts and notebooks that import it.
[tool.setuptools.packages.find]
include = ["core*"]

[tool.pytest.ini_options]
testpaths = ["tests", "projects/cml_retrieval/tests", "projects/physics_ml/tests", "projects/openmesh_nyc/tests", "projects/opensense_pipeline/tests", "projects/spatial_interpolation/tests"]
addopts = "-q"
filterwarnings = [
    # poligrain's wet/dry metrics take the mean of an empty slice when a
    # category is empty; the result is NaN and handled
    "ignore:Mean of empty slice:RuntimeWarning",
    "ignore:invalid value encountered in scalar divide:RuntimeWarning",
    "ignore:numpy.ndarray size changed:RuntimeWarning",
]
